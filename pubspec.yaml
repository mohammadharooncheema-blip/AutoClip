name: autoclip
description: "AutoClip - Turn one video into multiple ready-to-use short clips with ready-made styles and auto-save to gallery."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  image_picker: ^1.1.2
  video_player: ^2.8.6
  path_provider: ^2.1.3
  path: ^1.9.0
  intl: ^0.19.0
  ffmpeg_kit_flutter_new: ^2.0.0
  gal: ^2.3.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
