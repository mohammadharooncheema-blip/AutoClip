name: Build AutoClip Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoClip-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK to a release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "autoclip-flutter-${{ github.run_number }}" build/app/outputs/flutter-apk/app-release.apk --title "AutoClip Flutter APK ${{ github.run_number }}" --notes "Built from main commit ${{ github.sha }}" || gh release upload "autoclip-flutter-${{ github.run_number }}" build/app/outputs/flutter-apk/app-release.apk --clobber
